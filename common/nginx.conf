server {
    listen 80;
    server_name localhost;

    # Never serve stale HTML from browser cache across deployments
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Cache static CSS/JS/assets while still revalidating; ?v= busts cache on release
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    }

    # Serve static frontend files and SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

}
