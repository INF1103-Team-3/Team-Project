

name: bitefinder

x-common: &common
  env_file: .env
  
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  restart: unless-stopped
  # A tiny init process, so `docker stop` shuts containers down at once.
  init: true

networks:
  bitefinder-net:
    name: bitefinder-net
    driver: bridge

services:
  brc:
    <<: *common
    build:
      context: .
      dockerfile: docker/brc.Dockerfile
    image: bitefinder-brc
    container_name: bitefinder-brc
    command: ["python", "BRC/halal_service.py"]
    environment:
      HALAL_SERVICE_HOST: 0.0.0.0
      HALAL_SERVICE_PORT: "8000"
      # Kept inside the mounted folder so atomic saves work.
      BRC_HISTORY_FILE: /app/BRC/data/restaurant_history.json
    expose:
      - "8000"
    networks:
      - bitefinder-net
    volumes:
      - ./BRC/data:/app/BRC/data          # halal directory + BRC history
      - ./data:/app/data                  # shared geocode cache
      - ./logs:/app/logs                  # shared operational log

  bis-brns:
    <<: *common
    build:
      context: .
      dockerfile: docker/bis-brns.Dockerfile
    image: bitefinder-bis-brns
    container_name: bitefinder-bis-brns
    # Stays running and idle. You open the chatbot inside it with:
    #   docker compose exec bis-brns python BIS/main.py
    command: ["sleep", "infinity"]
    healthcheck:
      # Healthy only while this container can reach the BRC container.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://brc:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      brc:
        condition: service_healthy        # wait until the service answers
    environment:
      BRC_SERVICE_URL: http://brc:8000    # the other container, by name
    networks:
      - bitefinder-net
    volumes:
      - ./BIS/data:/app/BIS/data          # accounts and profile state
      - ./BRNS/data:/app/BRNS/data        # restaurant catalog, search history
      - ./data:/app/data
      - ./logs:/app/logs
