# Two containers on one network:
#   brc      - BRC halal checker service (always running)
#   bis-brns - BIS + BRNS (kept running; open the chatbot with `docker compose exec`)
#
#   docker compose up -d --build
#   docker compose exec bis-brns python main.py
#   docker compose exec bis-brns python tests/run_tests.py all
#
# Test container internet and service networking:
#   docker compose exec bis-brns python -c "import urllib.request; r=urllib.request.urlopen('https://www.google.com/generate_204', timeout=10); print('Internet working, HTTP', r.status)"
#   docker compose exec brc python -c "import urllib.request; r=urllib.request.urlopen('https://www.google.com/generate_204', timeout=10); print('Internet working, HTTP', r.status)"
#   docker compose exec bis-brns python -c "import urllib.request; print(urllib.request.urlopen('http://brc:8000/health', timeout=5).read().decode())"
#
# Inspect network and BRC errors:
#   docker compose logs --tail=100 brc
#   docker compose exec bis-brns tail -n 100 logs/bitefinder.log
name: bitefinder

services:
  brc:
    build:
      context: .
      target: brc
    image: bitefinder-brc
    container_name: bitefinder-brc
    hostname: brc
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - brc-data:/data
      - bitefinder-logs:/data/logs
    networks:
      - bitefinder-net

  bis-brns:
    build:
      context: .
      target: bis-brns
      args:
        SEED_ACCOUNTS: ${SEED_ACCOUNTS:-yes}   # set to "no" to leave users.json out of the image
    image: bitefinder
    container_name: bitefinder-bis-brns
    hostname: bis-brns
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    env_file:
      - path: .env
        required: false
    environment:
      BRC_SERVICE_URL: http://brc:8000
    depends_on:
      brc:
        condition: service_healthy
    volumes:
      - bis-brns-data:/data
      - bitefinder-logs:/data/logs
    networks:
      - bitefinder-net

networks:
  bitefinder-net:
    name: bitefinder-net
    driver: bridge
    internal: false   # containers can reach each other AND the internet

volumes:
  brc-data:
    name: bitefinder-brc-data
  bis-brns-data:
    name: bitefinder-bis-brns-data
  bitefinder-logs:
    name: bitefinder-logs
