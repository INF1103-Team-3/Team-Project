name: Test BiteFinder

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t bitefinder .

      - name: Run tests inside Docker
        run: docker run --rm --entrypoint python bitefinder -m unittest discover -s tests -v
