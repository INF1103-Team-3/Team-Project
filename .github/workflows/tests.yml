name: Test BiteFinder

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install style checker
        run: python -m pip install 'pycodestyle>=2.11,<3'
      - name: Check Python style
        run: >-
          python -m pycodestyle BIS BRNS BRC common http_gateway
          main.py tests project_overview

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Build and start BiteFinder
        run: docker compose up -d --build

      - name: Run tests inside Docker
        run: >-
          docker compose exec -T -e BITEFINDER_TEST_COLOR=never bis-brns
          python tests/run_tests.py all

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop BiteFinder
        if: always()
        run: docker compose down -v
