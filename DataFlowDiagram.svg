<svg xmlns="http://www.w3.org/2000/svg" width="3300" height="2240" viewBox="0 0 3300 2240">
<title>BiteFinder logical data-flow diagram</title>
<desc>Users access BIS through CLI or web. BIS calls BRNS; only BRNS calls the independent BRC verifier. Labelled arrows show requests, returned data, external services and subsystem storage.</desc>
