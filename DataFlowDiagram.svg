<text x="1650" y="1927" text-anchor="middle" font-family="monospace" font-size="37" fill="#18324b" font-weight="bold">BOUNDARIES AND SCOPE</text>
<text x="1650" y="1979" text-anchor="middle" font-family="monospace" font-size="29" fill="#18324b" font-weight="normal">Web: browser &gt; nginx &gt; FastAPI gateway &gt; BIS. CLI enters BIS directly.</text>
<text x="1650" y="2019" text-anchor="middle" font-family="monospace" font-size="29" fill="#18324b" font-weight="normal">Only BRNS requests BRC checks (HTTP /check in Compose); no direct user/BIS access.</text>
<text x="1650" y="2059" text-anchor="middle" font-family="monospace" font-size="29" fill="#18324b" font-weight="normal">D1/D2 share MongoDB; explicit CLI JSON mode remains supported. Shared geocode cache omitted.</text>
<text x="1650" y="2099" text-anchor="middle" font-family="monospace" font-size="29" fill="#18324b" font-weight="normal">AI output is validated before domain decisions; local/cache paths may skip AI calls.</text>
<text x="1650" y="2139" text-anchor="middle" font-family="monospace" font-size="29" fill="#18324b" font-weight="normal">BRC refresh retains usable records while stale snapshots are updated in the background.</text>
<text x="1650" y="2216" text-anchor="middle" font-family="monospace" font-size="26" fill="#18324b" font-weight="normal">Legend: yellow = external entities  |  rounded blue = process  |  double-line green = store  |  arrow = named data flow</text>
</svg>
